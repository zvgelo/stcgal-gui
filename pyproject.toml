[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stcgal-gui"
version = "0.1.0"
description = "Natywny graficzny programator mikrokontrolerów STC (backend: stcgal)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.8", "pyserial>=3.5"]

[project.optional-dependencies]
bundle = ["pyinstaller>=6.10", "stcgal==1.10"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10", "types-pyserial"]

[project.gui-scripts]
stcgal-gui = "stcgal_gui.__main__:main"

[project.scripts]
stcgal-backend = "stcgal_gui.backend_entry:main"

[tool.setuptools.packages.find]
include = ["stcgal_gui*"]

[tool.setuptools.package-data]
stcgal_gui = ["resources/*", "resources/translations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
