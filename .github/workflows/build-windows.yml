name: build-windows

# Ręcznie (workflow_dispatch) oraz dla zmian dotyczących budowania/aplikacji. Nie publikuje wydań.
on:
  workflow_dispatch:
  pull_request:
    paths: ["stcgal_gui/**", "packaging/**", "scripts/**", "tests/**", "pyproject.toml", ".github/workflows/build-windows.yml"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"   # wersja wspierana przez PySide6 i PyInstaller
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Biblioteki systemowe Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Zależności
        run: python -m pip install -e ".[dev,bundle]"
      - name: ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy stcgal_gui
      - name: pytest
        run: python -m pytest -q

  build:
    name: build Windows x64 (STC-Programmer.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Inno Setup (do opcjonalnego instalatora)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      # Cała logika buildu jest w skrypcie (ta sama co lokalnie): zależności, PyInstaller, backend stcgal,
      # testy uruchomieniowe (--selftest, --smoke-gui), SHA-256 i instalator.
      - name: Build onefile + instalator (scripts/build-windows.ps1)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -PythonExe (Get-Command python).Source -Installer -Verbose
      - name: Smoke test pliku EXE (onefile, w środowisku Windows)
        shell: pwsh
        run: |
          $exe = "dist\windows\STC-Programmer.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--report","$env:RUNNER_TEMP\selftest.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { throw "selftest: kod $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-gui","$env:RUNNER_TEMP\smoke" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\smoke\smoke.json"
          if ($p.ExitCode -ne 0) { throw "smoke-gui: kod $($p.ExitCode)" }
      - name: Smoke test instalatora (cicha instalacja per-user, uruchomienie, odinstalowanie)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "stc-install"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\STC-Programmer-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalator: kod $($p.ExitCode)" }
          $backend = Get-ChildItem -Path $dir -Recurse -Filter stcgal-backend.exe | Select-Object -First 1
          if (-not $backend) { throw "brak stcgal-backend.exe w instalacji" }
          & $backend.FullName -V
          if ($LASTEXITCODE -ne 0) { throw "backend -V" }
          $p = Start-Process -FilePath "$dir\STC-Programmer.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest po instalacji: kod $($p.ExitCode)" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "deinstalator: kod $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\STC-Programmer.exe") { throw "pliki po odinstalowaniu nadal istnieją" }
      - uses: actions/upload-artifact@v4
        with:
          name: STC-Programmer-windows-x64
          path: |
            dist/windows/STC-Programmer.exe
            dist/windows/STC-Programmer.sha256
            dist/windows/BUILD-REPORT.txt
            dist/STC-Programmer-Setup-x64.exe
          if-no-files-found: error
