name: build-linux

# Pakiety Linux: AppImage, tar.gz, .deb (Ubuntu 22.04, glibc 2.35: działają na nowszych dystrybucjach)
# oraz .rpm (kontener Fedora). Uruchamiany ręcznie i dla zmian w kodzie/budowaniu.
on:
  workflow_dispatch:
  pull_request:
    paths: ["stcgal_gui/**", "packaging/**", "scripts/**", "pyproject.toml", ".github/workflows/build-linux.yml"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  QT_QPA_PLATFORM: offscreen

jobs:
  deb-appimage-tar:
    name: AppImage, deb, tar.gz (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Biblioteki Qt do testów offscreen
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libfuse2
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Zależności
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build (tar.gz, deb, AppImage) i testy uruchomieniowe
        run: STC_PYTHON="$(which python)" ./scripts/build-linux.sh --formats tar,deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: STC-Programmer-linux-ubuntu22
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS
          if-no-files-found: error

  rpm:
    name: rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Narzędzia
        run: dnf install -y git python3.13 rpm-build libxkbcommon mesa-libEGL mesa-libGL fontconfig dbus-libs xcb-util-cursor glib2
      - uses: actions/checkout@v4
      - name: Zależności (Python 3.13)
        run: python3.13 -m ensurepip --upgrade && python3.13 -m pip install -r packaging/requirements-build.txt
      - name: Build (rpm) i testy uruchomieniowe
        run: STC_PYTHON=/usr/bin/python3.13 ./scripts/build-linux.sh --formats rpm
      - uses: actions/upload-artifact@v4
        with:
          name: STC-Programmer-linux-fedora
          path: |
            dist/linux/*.rpm
            dist/linux/SHA256SUMS
          if-no-files-found: error
